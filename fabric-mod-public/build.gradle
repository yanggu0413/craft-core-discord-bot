plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
}

version = project.mod_version
group = project.maven_group

subprojects {
    apply plugin: 'net.fabricmc.fabric-loom'
    apply plugin: 'maven-publish'

    version = rootProject.version
    group = rootProject.group

    base {
        archivesName = project.name
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.hasProperty('fabric_api_version') ? rootProject.fabric_api_version : rootProject.fabric_version}"

        // JUnit 5 and Mockito for testing
        testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.2"
        testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.2"
        testImplementation "org.junit.platform:junit-platform-launcher:1.10.2"
        testImplementation "org.mockito:mockito-core:5.11.0"
        testImplementation "org.ow2.asm:asm:9.6"
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    tasks.withType(Copy).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    tasks.withType(Jar).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    java {
        withSourcesJar()
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    processResources {
        inputs.property "version", project.version

        filesMatching("fabric.mod.json") {
            expand "version": project.version
        }
    }

    test {
        useJUnitPlatform()
        maxHeapSize = '512m'
        jvmArgs '-XX:+EnableDynamicAgentLoading', '-Dnet.bytebuddy.experimental=true', '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED', '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED'
        systemProperty 'net.bytebuddy.experimental', 'true'
    }

    jar {
        if (rootProject.file("LICENSE").exists()) {
            from(rootProject.file("LICENSE")) {
                rename { "${it}_${project.name}" }
            }
        }
    }
}
